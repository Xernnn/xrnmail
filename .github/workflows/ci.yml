name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI checks code and needs to change nothing on the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The main process runs on Electron 44's own Node, which is 24, and
          # @types/node is 24 to match; the unit tests should run on the same.
          node-version: 24
          cache: npm

      - run: npm ci

      # tests/share.test.ts runs the laptop's share against the real xrnmail-sync, which reads
      # bcrypt hashes.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - run: python -m pip install --quiet bcrypt

      - name: Typecheck (main + renderer)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  ui:
    # Drives the built app through Playwright (e2e/) against the fake Gmail and
    # SMTP servers in tests/. It needs a display: xvfb-run gives it a virtual one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: UI tests
        run: xvfb-run -a npm run test:e2e

  server:
    # xrnmail-sync, the settings service the laptop and the phone share. On the oldest and newest
    # Python it may run on: how deep json.loads nests changed in 3.14. Not the runner's own
    # Python: Ubuntu's 3.12.3 answers a garbage request line with no status line (fixed in later
    # CPython), which test_an_unparseable_request_gets_an_answer catches.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Sync server and deploy tests
        run: |
          python --version
          python -m pip install --quiet bcrypt
          python -m unittest server/test_xrnmail_sync.py server/test_deploy.py
