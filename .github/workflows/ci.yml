name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI checks code and needs to change nothing on the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The main process runs on Electron 44's own Node, which is 24, and
          # @types/node is 24 to match; the unit tests should run on the same.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck (main + renderer)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  ui:
    # Drives the built app through Playwright (e2e/) against the fake Gmail and
    # SMTP servers in tests/. It needs a display: xvfb-run gives it a virtual one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: UI tests
        run: xvfb-run -a npm run test:e2e
